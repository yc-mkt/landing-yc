<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>신청 완료</title>
<!--
  YC 공통 신청 완료 페이지 (monday 폼 '제출 후 이동 주소'용)
  주소: https://yc-mkt.github.io/landing-yc/thanks/?form=<폼이름>&brand=<ency|carveco|nextwood|smartware|yc|support>
  - 메타 픽셀 463092085510658(YC Consulting) PageView + Lead(content_name=폼이름) 1회
  - 개인정보·고객정보는 주소/페이지에 넣지 않는다 (form·brand 두 값만 읽음)
-->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  // 폼이름: 한글·영문·숫자·공백·-_. 만 허용, 60자 이내
  var form = (q.get('form') || 'unknown').replace(/[^0-9A-Za-z가-힣 _.\-]/g, '').slice(0, 60) || 'unknown';
  var brand = (q.get('brand') || '').toLowerCase().replace(/[^a-z]/g, '').slice(0, 20);
  window.__ycThanks = { form: form, brand: brand };

  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '463092085510658');
  fbq('track', 'PageView');

  // 새로고침으로 Lead가 두 번 잡히지 않게 (같은 탭·같은 폼 30분 1회)
  var key = 'yc_lead_' + form, now = Date.now(), seen = 0;
  try { seen = +sessionStorage.getItem(key) || 0; } catch (e) {}
  if (now - seen > 30 * 60 * 1000) {
    fbq('track', 'Lead', { content_name: form, content_category: brand || 'yc' });
    try { sessionStorage.setItem(key, String(now)); } catch (e) {}
  }
})();
</script>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --sub:#57606a; --line:#e3e6ea; --accent:#0b5cd5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f25; --ink:#eef1f4; --sub:#a4adb7; --line:#2a313a; --accent:#6aa6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:56px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px 28px; text-align:center; }
  .check { width:64px; height:64px; border-radius:50%; background:var(--accent); color:#fff;
    font-size:34px; line-height:64px; margin:0 auto 20px; }
  h1 { font-size:26px; margin:0 0 14px; }
  p { font-size:18px; line-height:1.65; color:var(--sub); margin:0 0 10px; }
  .box { text-align:left; background:var(--bg); border-radius:12px; padding:18px 20px; margin:22px 0 4px; }
  .box p { font-size:17px; color:var(--ink); margin:0 0 6px; }
  a.btn { display:inline-block; margin-top:24px; padding:14px 26px; border-radius:10px;
    background:var(--accent); color:#fff; text-decoration:none; font-size:17px; font-weight:700; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>신청이 완료되었습니다</h1>
    <p>남겨 주신 내용은 담당자에게 바로 전달되었습니다.</p>
    <div class="box">
      <p>· 자료(eBook·가이드북)를 신청하셨다면 입력하신 이메일로 자료가 발송됩니다.</p>
      <p>· 메일이 보이지 않으면 스팸함·프로모션함도 확인해 주세요.</p>
      <p>· 상담·견적 문의는 담당자가 확인 후 연락드립니다.</p>
    </div>
    <a class="btn" id="home" href="https://www.ycgroup.co.kr">홈페이지로 돌아가기</a>
  </div>
</main>
<script>
(function () {
  var home = {
    ency: 'https://encycadcam.co.kr', carveco: 'https://carveco.co.kr',
    nextwood: 'https://nextwood.co.kr', smartware: 'https://smartware.kr',
    yc: 'https://www.ycgroup.co.kr', support: 'https://www.ycgroup.co.kr'
  }[(window.__ycThanks || {}).brand];
  if (home) document.getElementById('home').href = home;
})();
</script>
</body>
</html>
